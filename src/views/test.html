<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataTable Pagination Example</title>
  <link href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-4">
    <h1>Data Table with DataTables.js</h1>
    <table id="dataTable" class="table table-striped display">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Body</th>
        </tr>
      </thead>
      <tbody id="data-table-body">
        <!-- Data will be dynamically inserted here -->
      </tbody>
    </table>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
  <script>
    $(document).ready(function () {
  const apiUrl = 'https://jsonplaceholder.typicode.com/posts';

  // Fetch data from JSONPlaceholder
  async function fetchData() {
    const response = await fetch(apiUrl);
    const data = await response.json();
    return data;
  }

  // Function to populate table and initialize DataTables
  async function initializeDataTable() {
    const data = await fetchData();
    const tableBody = $('#data-table-body');

    // Populate table with data
    data.forEach(item => {
      const row = `<tr>
                    <td>${item.id}</td>
                    <td>${item.title}</td>
                    <td>${item.body}</td>
                  </tr>`;
      tableBody.append(row);
    });

    // Initialize DataTable with options
    $('#dataTable').DataTable({
      paging: true,
      pageLength: 10,     // Set the number of entries per page
      lengthMenu: [5, 10, 20, 50],  // Options for number of entries
      ordering: true,      // Enable column sorting
      search: true,        // Enable search box
      info: true           // Show "Showing X of Y entries" info
    });
  }

  initializeDataTable();
});

  </script>
</body>
</html>
